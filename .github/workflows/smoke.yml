name: Smoke tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest

    env:
      HEADLESS: true

    defaults:
      run:
        working-directory: Practice2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install

      - name: Run smoke tests
        run: |
          pytest -m "smoke and not external" \
            --ignore=week_2/tests/test_API.py \
            --ignore=week_2/tests/test_api_login.py \
            --ignore=week_2/tests/test_api_unknown.py \
            --ignore=week_2/tests/test_api_users.py \
            --ignore=week_2/tests/test_github_login.py \
            --ignore=week_2/tests/test_resources_selenium.py