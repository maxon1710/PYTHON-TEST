name: Regression tests

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

  push:
    branches:
      - main
      - feature/**

jobs:
  regression:
    name: Run regression tests
    runs-on: ubuntu-latest

    env:
      HEADLESS: true

    defaults:
      run:
        working-directory: Practice2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install

      - name: Run regression tests
        run: |
          pytest -m "regression and not external" \
            --ignore=week_2/tests/api/test_api_login.py \
            --ignore=week_2/tests/api/test_api_unknown.py \
            --ignore=week_2/tests/api/test_api_users.py
